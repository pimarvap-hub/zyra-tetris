<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff2d55" />
  <meta name="description" content="ZYRA Tetris — собери линии из банок лимонада! Яркая игра от ZYRA Lemonade." />
  <meta property="og:title" content="ZYRA Tetris 🥤" />
  <meta property="og:description" content="Тетрис из банок ZYRA — играй и делись с друзьями!" />
  <meta property="og:type" content="website" />
  <title>ZYRA Tetris 🥤</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/logo.png" type="image/png" />
</head>
<body>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <div class="app">
    <!-- START SCREEN -->
    <section class="screen" id="start-screen">
      <div class="start-card">
        <img class="brand-logo" src="assets/logo.png" alt="ZYRA" width="140" height="auto" decoding="async" />
        <h1>ZYRA <span>TETRIS</span></h1>
        <p class="tagline">Собирай линии из ярких банок лимонада</p>
        <div class="flavor-row" id="flavor-preview"></div>
        <button class="btn btn-play" id="btn-start">ИГРАТЬ 🥤</button>
        <p class="hint-keys">
          <span>← → двигать</span>
          <span>↑ поворот</span>
          <span>↓ ускорить</span>
          <span>Space сброс</span>
          <span>C hold</span>
        </p>
        <p class="best-start">Рекорд: <strong id="best-start">0</strong></p>
      </div>
    </section>

    <!-- GAME SCREEN -->
    <section class="screen hidden" id="game-screen">
      <header class="game-top">
        <img src="assets/logo.png" alt="ZYRA" class="mini-logo" width="28" height="auto" decoding="async" />
        <div class="stat-pill">
          <span>Очки</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat-pill">
          <span>Ур.</span>
          <strong id="level">1</strong>
        </div>
        <div class="stat-pill">
          <span>Линии</span>
          <strong id="lines">0</strong>
        </div>
      </header>

      <div class="game-layout">
        <aside class="side side-left">
          <div class="panel">
            <h3>УДЕРЖ.</h3>
            <canvas id="hold" width="128" height="128"></canvas>
          </div>
          <button class="btn btn-ghost" id="btn-pause" type="button" aria-label="Пауза">⏸</button>
        </aside>

        <div class="board-wrap">
          <canvas id="board" width="360" height="720"></canvas>
          <div class="overlay hidden" id="pause-overlay">
            <p>ПАУЗА</p>
            <button class="btn btn-play btn-sm" id="btn-resume">Продолжить</button>
          </div>
        </div>

        <aside class="side side-right">
          <div class="panel">
            <h3>ДАЛЕЕ</h3>
            <canvas id="next" width="128" height="128"></canvas>
          </div>
          <div class="panel flavor-tip" id="flavor-tip">
            <img id="tip-img" src="assets/anar.png" alt="" width="48" height="auto" decoding="async" />
            <span id="tip-name">Анар</span>
          </div>
        </aside>
      </div>

      <!-- Mobile / touch controls -->
      <div class="controls" id="controls">
        <div class="ctrl-row ctrl-top">
          <button type="button" class="ctrl hold" data-act="hold" aria-label="Удержать">HOLD</button>
          <button type="button" class="ctrl rot" data-act="rotate-ccw" aria-label="Поворот влево">↺</button>
          <button type="button" class="ctrl rot" data-act="rotate" aria-label="Поворот вправо">↻</button>
        </div>
        <div class="ctrl-row ctrl-mid">
          <button type="button" class="ctrl dir" data-act="left" aria-label="Влево">◀</button>
          <button type="button" class="ctrl dir" data-act="down" aria-label="Вниз">▼</button>
          <button type="button" class="ctrl dir" data-act="right" aria-label="Вправо">▶</button>
        </div>
        <button type="button" class="ctrl drop" data-act="drop" aria-label="Сброс вниз">⬇ DROP</button>
        <p class="swipe-hint">свайп: ←→ двигать · ↓ вниз · ↑ сброс · тап = поворот</p>
      </div>
    </section>

    <!-- GAME OVER -->
    <section class="screen hidden" id="over-screen">
      <div class="start-card over-card">
        <img class="brand-logo sm" src="assets/logo.png" alt="ZYRA" width="100" height="auto" decoding="async" />
        <h2>ИГРА ОКОНЧЕНА</h2>
        <p class="final-score">Очки: <strong id="final-score">0</strong></p>
        <p class="final-meta">Линии: <span id="final-lines">0</span> · Уровень: <span id="final-level">1</span></p>
        <p class="best-line">Рекорд: <strong id="best-over">0</strong></p>
        <div class="over-actions">
          <button class="btn btn-play" id="btn-again">ЕЩЁ РАЗ 🔥</button>
          <button class="btn btn-share" id="btn-share">Поделиться 🔗</button>
        </div>
      </div>
    </section>
  </div>

  <script src="game.js"></script>
</body>
</html>
